name: CI/CD to AWS EC2

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. 자바 8 버전 설정
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    # 2. Maven 빌드 (target/*.war 파일 생성)
    - name: Build with Maven
      run: mvn clean package

    # 3. 빌드된 .war 파일을 EC2로 전송 및 톰캣 배포
    - name: Send to EC2 and Deploy
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: ${{ secrets.EC2_SSH_PORT }}
        script: |
          echo "=== Connected to AWS EC2 successfully ==="
          
          # 기존 톰캣에 돌아가던 구버전 파일 및 폴더 정리 (필요시 경로 조정)
          sudo rm -rf /usr/local/tomcat9/webapps/ROOT*
          sudo rm -rf /usr/local/tomcat9/webapps/hello*

    # 4. scp를 통해 빌드된 war 파일을 EC2 톰캣 webapps 폴더로 전송
    - name: Copy WAR to EC2 Tomcat
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: ${{ secrets.EC2_SSH_PORT }}
        source: "target/*.war"
        target: "/usr/local/tomcat9/webapps/"
        strip_components: 1 # target 폴더를 떼고 안의 war 파일만 쏙 집어넣습니다.

    # 5. 권한 정리 및 톰캣 재시작 (필요시)
    - name: Restart Tomcat
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: ${{ secrets.EC2_SSH_PORT }}
        script: |
          # 톰캣 폴더 권한 맞추기
          sudo chmod -R 755 /usr/local/tomcat9/webapps/
          echo "=== Deployment Finished Successfully! ==="
