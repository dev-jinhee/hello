name: docker 이미지 빌드 및 배포

on:
  push:
    branches:
      - empty      # 주석 : main 브랜치에 push가 되면 actions가 동작함

#환경변수
env:
  SERVER_IP: 43.201.146.222

jobs:
  build:
    runs-on: ubuntu-latest  # 어떤 운영체제 버전에서 실행하는지 설정

    steps:
    - name: 소스 check out 
      uses: actions/checkout@v3

    - name: 메이븐 빌드
      run: mvn clean package

    - name: 보안환경변수를 이용하여 개인키 파일생성
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        
    - name: actions을 사용하여 보안환경변수를 이용하여 개인키 파일생성
      uses: webfactory/ssh-agent@v0.5.3
      with:
        ssh-private-key: ${{ secrets.EC2_SSH_KEY }}
        
    - name: 서버연결시 지문등록
      run: ssh-keyscan -t ed25519 ${{ env.SERVER_IP }} >> ~/.ssh/known_hosts
    
    - name: Docker 로그인
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKER_USER}}
        password: ${{ secrets.DOCKER_ACCESS_TOKEN}}
        
    - name: docker 이미지 빌드 
      run: |
        docker build -t ${{secrets.DOCKER_USER}}/hello:latest .
        
    - name: docker hub 이미지 저장 
      run: |
        docker push ${{secrets.DOCKER_USER}}/hello:latest

  deploy:
    needs: build
    name: 운영서버에 배포 진행
    runs-on: ubuntu-latest  
    steps: 
    - name: 보안환경변수를 이용하여 개인키 파일생성
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
            
    - name: 서버연결시 지문등록
      run: ssh-keyscan -t ed25519 ${{ env.SERVER_IP }} >> ~/.ssh/known_hosts
      
    - name: 배포 실행     
      run: |
        ssh -i ~/.ssh/id_rsa ubuntu@${{ env.SERVER_IP }} << 'EOF'
           docker login -u ${{ secrets.DOCKER_USER }} -p ${{ secrets.DOCKER_ACCESS_TOKEN }}
           docker stop hello_app || true
           docker rm hello_app || true
           docker rmi ${{ secrets.DOCKER_USER }}/hello:latest || true
           docker run -dit --name hello_app --add-host=host.docker.internal:host-gateway -p 80:8080 ${{ secrets.DOCKER_USER }}/hello:latest
        EOF