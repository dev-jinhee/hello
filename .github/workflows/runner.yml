name: runners를 사용하여 빌드 및 배포

on:
  push:
    branches:
      - main      # 주석 : main 브랜치에 push가 되면 actions가 동작함

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps: 
    - name: 소스 check out 
      uses: actions/checkout@v3

    - name: 메이븐 빌드
      run: mvn clean package
     
    - name: Docker 로그인
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKER_USER}}
        password: ${{ secrets.DOCKER_ACCESS_TOKEN}}
        
    - name: docker 이미지 빌드 
      run: |
        docker build -t ${{secrets.DOCKER_USER}}/hello:latest .
        
    - name: docker hub 이미지 저장 
      run: |
        docker push ${{secrets.DOCKER_USER}}/hello:latest
      
    - name: 배포 실행     
      run: |
        docker stop hello_app || true
        docker rm hello_app || true
        docker rmi ${{ secrets.DOCKER_USER }}/hello:latest || true
        docker run -dit --name hello_app -p 80:8080 ${{ secrets.DOCKER_USER }}/hello:latest