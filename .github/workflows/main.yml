name: 전자정부프레엠웍을 사용하여 빌드 및 배포

on:
  push:
    branches:
      - main      # 주석 : main 브랜치에 push가 되면 actions가 동작함

jobs:
  build:
    runs-on: ubuntu-latest  # 어떤 운영체제 버전에서 실행하는지 설정

    steps:
    - name: git 저장소 소스 복사전의 폴더 구조
      run: ls -la
    
    - name: 소스 check out 
      uses: actions/checkout@v3

    - name: git 저장소 소스 복사후의 폴더 구조
      run: ls -la

    - name: git 저장소 소스 복사후의 hello 폴더 구조 # 리눅스 셀 명령어 2줄 이상 실행시
      run: |   
        ls -la
      
    - name: 메이븐 빌드
      run: mvn clean package

    - name: 도커 이미지 빌드
      run: docker build -t ${{ secrets.DOCKER_USER }}/hello:latest .

    - name: Docker Hub 로그인
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

    - name: 도커 이미지 푸시
      run: docker push ${{ secrets.DOCKER_USER }}/hello:latest

    - name: 보안환경변수를 이용하여 개인키 파일생성
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        
    - name: actions을 사용하여 보안환경변수를 이용하여 개인키 파일생성
      uses: webfactory/ssh-agent@v0.5.3
      with:
        ssh-private-key: ${{ secrets.EC2_SSH_KEY }}
        
    - name: 서버연결시 지문등록
      run: ssh-keyscan -t ed25519 43.201.146.222 >> ~/.ssh/known_hosts
 
    - name: 운영서버에 도커 배포 진행 
      run: |
        ssh -i ~/.ssh/id_rsa ubuntu@43.201.146.222 << 'EOF'
          sudo docker stop hello-app || true
          sudo docker rm hello-app || true
          sudo docker pull ${{ secrets.DOCKER_USER }}/hello:latest
          sudo docker run -d --name hello-app -p 8080:8080 ${{ secrets.DOCKER_USER }}/hello:latest
        EOF
